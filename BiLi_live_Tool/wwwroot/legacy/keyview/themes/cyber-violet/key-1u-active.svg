<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cva-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff44fe"/>
      <stop offset="50%" stop-color="#a540f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="cva-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1466"/>
      <stop offset="100%" stop-color="#1c0733"/>
    </linearGradient>
    <filter id="cv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <polygon points="12,4 88,4 98,14 98,88 88,98 12,98 2,88 2,14" fill="url(#cva-border)" filter="url(#cv-glow)"/>
  <polygon points="14,8 86,8 94,16 94,86 86,94 14,94 6,86 6,16" fill="url(#cva-face)"/>
  <!-- High voltage neon lines -->
  <path d="M18,12 L12,18 M82,12 L88,18 M18,88 L12,82 M82,88 L88,82" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="50" cy="50" r="14" fill="none" stroke="#ff44fe" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
</svg>