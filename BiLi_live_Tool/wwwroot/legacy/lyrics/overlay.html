<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>歌词浮层 · OBS 浏览器源</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;height:100%;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  /* 外层只负责把窄条居中，背景全透明 */
  #ly-wrap{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:center;}
  /* 竖条卡片：宽度贴合歌词内容（fit-content），不再铺满浏览器源；上限 48vh 保证竖向比例 */
  #ly-stage{position:relative;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;
    height:100%;width:fit-content;min-width:min(100%,24vh);max-width:min(100%,48vh);
    padding:2.2vh 2.8vh;color:#fff;opacity:0;transition:opacity .45s ease;
    background:linear-gradient(180deg,rgba(12,13,18,.86),rgba(12,13,18,.62) 18%,rgba(12,13,18,.62) 82%,rgba(12,13,18,.86));
    border-radius:min(2.4vh,18px);box-shadow:0 6px 26px rgba(0,0,0,.35);}
  #ly-stage.show{opacity:1;}
  #ly-head{flex:0 0 auto;width:100%;text-align:center;padding-bottom:1.1vh;}
  #ly-name{font-size:clamp(13px,2.4vh,24px);font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.7);
    max-width:44vh;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #ly-artist{font-size:clamp(10px,1.5vh,16px);color:rgba(255,255,255,.62);margin-top:.5vh;
    max-width:44vh;margin-left:auto;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #ly-req{font-size:clamp(9px,1.3vh,14px);color:#fb7299;font-weight:600;margin-top:.4vh;}
  /* 歌词视窗：上下渐隐，只露出中间一段 */
  #ly-viewport{position:relative;flex:1 1 auto;width:100%;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);}
  #ly-track{width:100%;will-change:transform;transition:transform .55s cubic-bezier(.22,.61,.36,1);}
  .lrc-line{text-align:center;padding:.7vh 2%;line-height:1.35;color:rgba(255,255,255,.4);
    font-size:clamp(11px,1.85vh,21px);transition:color .35s,transform .35s,text-shadow .35s;}
  .lrc-line.near{color:rgba(255,255,255,.66);}
  /* 当前句用 scale 放大（不影响布局高度，居中计算才准确） */
  .lrc-line.cur{color:#fff;font-weight:700;transform:scale(1.3);
    text-shadow:0 2px 14px rgba(0,0,0,.8),0 0 24px rgba(251,114,153,.35);}
  .lrc-none{display:block;text-align:center;color:rgba(255,255,255,.5);font-size:clamp(11px,1.7vh,18px);padding:2vh 0;}
  #ly-foot{flex:0 0 auto;width:100%;padding-top:1.1vh;}
  #ly-bar-wrap{height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;}
  #ly-bar{height:100%;width:0%;background:linear-gradient(90deg,#fb7299,#fc8bab);border-radius:2px;transition:width .3s linear;}
  #ly-time{text-align:center;font-size:clamp(9px,1.4vh,14px);color:rgba(255,255,255,.55);
    margin-top:.7vh;font-variant-numeric:tabular-nums;}
  #ly-status{position:fixed;left:0;right:0;bottom:0;padding:6px 12px;font-size:12px;text-align:center;
    color:rgba(255,255,255,.75);background:rgba(10,11,14,.6);display:none;}
  #ly-debug{position:fixed;top:8px;left:8px;max-width:520px;padding:8px 10px;font:12px/1.5 Consolas,monospace;
    color:#0f0;background:rgba(0,0,0,.72);white-space:pre-wrap;border-radius:6px;z-index:99;}
</style>
</head>
<body>
<div id="ly-wrap">
  <div id="ly-stage">
    <div id="ly-head">
      <div id="ly-name"></div>
      <div id="ly-artist"></div>
      <div id="ly-req"></div>
    </div>
    <div id="ly-viewport"><div id="ly-track"></div></div>
    <div id="ly-foot">
      <div id="ly-bar-wrap"><div id="ly-bar"></div></div>
      <div id="ly-time">00:00 / 00:00</div>
    </div>
  </div>
</div>
<div id="ly-status"></div>
<script src="./overlay.js?v=20260909i"></script>
</body>
</html>
