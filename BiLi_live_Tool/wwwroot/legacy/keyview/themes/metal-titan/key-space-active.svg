<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">
  <defs>
    <linearGradient id="tspa-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#1c1103"/>
    </linearGradient>
    <linearGradient id="tspa-plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#332412"/>
      <stop offset="50%" stop-color="#4a3116"/>
      <stop offset="100%" stop-color="#211508"/>
    </linearGradient>
    <filter id="glow-sp" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="2" y="4" width="396" height="74" rx="6" fill="url(#tspa-bevel)" stroke="#ff9f1c" stroke-width="2"/>
  <rect x="6" y="8" width="388" height="66" rx="4" fill="url(#tspa-plate)"/>
  <!-- Glowing laser line -->
  <rect x="40" y="38" width="320" height="4" rx="2" fill="#ffb703" filter="url(#glow-sp)"/>
</svg>