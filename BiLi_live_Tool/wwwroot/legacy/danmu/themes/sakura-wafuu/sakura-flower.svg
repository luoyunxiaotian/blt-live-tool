    <path fill="url(#sakuraGrad)" stroke="#ff4d6d" stroke-width="0.8" transform="rotate(72)" d="M0,0 Q-7,-12 0,-18 Q7,-12 0,0"/>
    <path fill="url(#sakuraGrad)" stroke="#ff4d6d" stroke-width="0.8" transform="rotate(144)" d="M0,0 Q-7,-12 0,-18 Q7,-12 0,0"/>
    <path fill="url(#sakuraGrad)" stroke="#ff4d6d" stroke-width="0.8" transform="rotate(216)" d="M0,0 Q-7,-12 0,-18 Q7,-12 0,0"/>
    <path fill="url(#sakuraGrad)" stroke="#ff4d6d" stroke-width="0.8" transform="rotate(288)" d="M0,0 Q-7,-12 0,-18 Q7,-12 0,0"/>
    <!-- Center stamen -->
    <circle cx="0" cy="0" r="3.5" fill="#ff4d6d"/>
    <circle cx="0" cy="0" r="1.5" fill="#fff"/>
