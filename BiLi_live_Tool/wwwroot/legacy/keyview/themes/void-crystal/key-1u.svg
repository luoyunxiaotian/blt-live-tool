<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="vc-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#da9bfa"/>
      <stop offset="35%" stop-color="#9d17c2"/>
      <stop offset="70%" stop-color="#4b0f7d"/>
      <stop offset="100%" stop-color="#1e0638"/>
    </linearGradient>
    <linearGradient id="vc-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0d4a"/>
      <stop offset="50%" stop-color="#140624"/>
      <stop offset="100%" stop-color="#08020f"/>
    </linearGradient>
    <linearGradient id="vc-cyan-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#1c7e99"/>
      <stop offset="100%" stop-color="#0e3f4d"/>
    </linearGradient>
    <linearGradient id="vc-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fd9eff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fd9eff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 3D Void Shadow -->
  <rect x="2" y="8" width="76" height="70" rx="14" fill="#0c0317"/>
  <!-- Outer Crystal Bevel -->
  <rect x="2" y="2" width="76" height="72" rx="14" fill="url(#vc-bevel)" stroke="#7121b3" stroke-width="1.5"/>
  <!-- Glowing Cyan Inset Line -->
  <rect x="5.5" y="5.5" width="69" height="65" rx="11" fill="none" stroke="url(#vc-cyan-core)" stroke-width="1.2" opacity="0.85"/>
  <!-- Dark Void Core Plate -->
  <rect x="8" y="8" width="64" height="60" rx="9" fill="url(#vc-core)"/>
  <!-- Inner Cyber Polygon Accents -->
  <polygon points="12,12 24,12 12,24" fill="#1c7e99" opacity="0.6"/>
  <polygon points="68,12 56,12 68,24" fill="#1c7e99" opacity="0.6"/>
  <polygon points="12,64 24,64 12,52" fill="#9d17c2" opacity="0.5"/>
  <polygon points="68,64 56,64 68,52" fill="#9d17c2" opacity="0.5"/>
  <!-- Top Gem Gloss -->
  <rect x="11" y="10" width="58" height="22" rx="6" fill="url(#vc-shine)"/>
</svg>
