<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80">
  <defs>
    <linearGradient id="ta-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9f1c"/>
      <stop offset="35%" stop-color="#6e3c06"/>
      <stop offset="100%" stop-color="#1c1103"/>
    </linearGradient>
    <linearGradient id="ta-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#332412"/>
      <stop offset="50%" stop-color="#4a3116"/>
      <stop offset="100%" stop-color="#211508"/>
    </linearGradient>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Active Bevel -->
  <rect x="2" y="4" width="156" height="74" rx="6" fill="url(#ta-bevel)" stroke="#ff9f1c" stroke-width="2"/>
  <!-- Main Face -->
  <rect x="6" y="8" width="148" height="66" rx="4" fill="url(#ta-plate)"/>
  <!-- Glowing LED Center Strip -->
  <rect x="20" y="38" width="120" height="4" rx="2" fill="#ffb703" filter="url(#glow-orange)"/>
  <circle cx="16" cy="20" r="2.5" fill="#ffb703"/>
  <circle cx="144" cy="20" r="2.5" fill="#ffb703"/>
</svg>