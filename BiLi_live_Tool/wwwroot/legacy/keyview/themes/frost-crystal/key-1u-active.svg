<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fca-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="fca-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4d7d"/>
      <stop offset="100%" stop-color="#0d2645"/>
    </linearGradient>
    <filter id="frost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <polygon points="10,4 90,4 98,12 98,90 90,98 10,98 2,90 2,12" fill="url(#fca-border)" filter="url(#frost-glow)"/>
  <polygon points="12,7 88,7 95,14 95,88 88,95 12,95 5,88 5,14" fill="url(#fca-face)"/>
  <!-- Glacial burst diamond in center -->
  <polygon points="50,22 62,50 50,78 38,50" fill="#ffffff" opacity="0.85"/>
  <polygon points="50,30 56,50 50,70 44,50" fill="#00f0ff"/>
</svg>