<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>直播小帮手</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="blt.css" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="BiLi_live_Tool.styles.css" />
    <link rel="icon" href="data:,">
    <style>
      /* 首帧前的加载态：与主题 token 同源（localStorage 已定主题），避免"先白后换肤" */
      #blt-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:14px;background:var(--bg,#10151c);color:var(--ink,#d7dee8);
        font:500 14px/1.6 "Noto Sans SC","Source Han Sans SC","思源黑体",sans-serif;z-index:2147483646}
      #blt-boot .b{font-size:22px;font-weight:700;letter-spacing:.5px}
      #blt-boot .r{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.14);
        border-top-color:var(--amber,#ffb224);animation:blt-spin .9s linear infinite}
      #blt-boot .s{font-size:12.5px;color:var(--ink-3,#5d6a7a)}
      @keyframes blt-spin{to{transform:rotate(360deg)}}
    </style>

</head>

<body>
    <script>
      // Apply the saved theme before first paint; Blazor reconciles with config.skin later.
      (function () {
        var t = 'console';
        try { t = localStorage.getItem('blt_theme') || 'console'; } catch (e) {}
        document.documentElement.dataset.theme = t;
        window.bltSetTheme = function (name) {
          document.documentElement.dataset.theme = name;
          try { localStorage.setItem('blt_theme', name); } catch (e) {}
        };
      })();


      // Bridge helpers used by the verify-lock banner: open a URL in the system
      // browser and trigger a forced re-verification through the local API.
      window.bltOpenExternal = function (url) {
        try {
          return fetch('/api/maui/shell/open-external', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url })
          }).then(function (r) { return r.ok; });
        } catch (e) { return false; }
      };
      window.bltFetchVerifyRefresh = function () {
        try {
          return fetch('/api/maui/verify/refresh', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
          }).then(function (r) { return r.json(); })
            .then(function (j) { var s = (j && j.state) || {}; return s.locked ? ('仍未通过：' + (s.message || '')) : ('验证通过：' + (s.name || '')); })
            .catch(function () { return '重试请求失败'; });
        } catch (e) { return '重试请求失败'; }
      };

      // Small localStorage helpers (nav fold state, etc.) callable from Blazor.
      window.bltGetJson = function (key) {
        try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
      };
      window.bltSetJson = function (key, value) {
        try { localStorage.setItem(key, value); } catch (e) { }
        return true;
      };

      // Tells the native layer the Blazor first paint is done (hide splash overlay),
      // and drops the in-page boot state.
      window.bltNotifyUiReady = function () {
        try {
          var b = document.getElementById('blt-boot');
          if (b && b.parentNode) b.parentNode.removeChild(b);
        } catch (e) { }
        try {
          fetch('/api/maui/app/ui-ready', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        } catch (e) { }
        return true;
      };

      // Verification hook used by the loopback debug bridge
      // (POST /api/maui/debug/eval). Returns a string for primitives, JSON
      // for objects, and an "ERR: ..." marker instead of throwing.
      window.bltEval = function (code) {
        try {
          var r = (0, eval)(code);
          if (typeof r === 'string') return r;
          if (r === undefined) return 'undefined';
          return JSON.stringify(r);
        } catch (e) {
          return 'ERR: ' + (e && e.message ? e.message : String(e));
        }
      };
    </script>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div id="blt-boot">
            <div class="b">直播小帮手</div>
            <div class="r"></div>
            <div class="s">正在载入界面…</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="blt-audio.js"></script>
    <script src="blt-panels.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
