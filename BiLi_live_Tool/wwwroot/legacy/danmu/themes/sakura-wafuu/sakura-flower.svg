<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="sakuraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="40%" stop-color="#ffb3c1"/>
      <stop offset="100%" stop-color="#fff0f3"/>
