<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文字挂件 · OBS 浏览器源</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;height:100%;font-family:"微软雅黑","Microsoft YaHei",sans-serif;}
  #wg-stage{position:fixed;inset:0;display:flex;align-items:center;overflow:hidden;}
  #wg-box{display:inline-block;box-sizing:border-box;max-width:100%;white-space:pre-wrap;word-break:break-all;line-height:1.4;}
  #wg-text{display:block;}
  /* 翻页切换过渡 */
  #wg-text.flip-out-x{transition:transform .35s ease-in,opacity .35s;transform:translateX(-26px);opacity:0;}
  #wg-text.flip-in-x{transition:transform .35s ease-out,opacity .35s;transform:translateX(0);opacity:1;}
  #wg-text.flip-enter-x{transform:translateX(26px);opacity:0;}
  #wg-text.flip-out-y{transition:transform .35s ease-in,opacity .35s;transform:translateY(-26px);opacity:0;}
  #wg-text.flip-in-y{transition:transform .35s ease-out,opacity .35s;transform:translateY(0);opacity:1;}
  #wg-text.flip-enter-y{transform:translateY(26px);opacity:0;}
</style>
</head>
<body>
<div id="wg-stage"><div id="wg-box"><span id="wg-text"></span></div></div>
<script src="./overlay.js?v=20260909a"></script>
</body>
</html>
