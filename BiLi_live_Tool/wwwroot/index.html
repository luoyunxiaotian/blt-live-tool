<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>B站直播助手</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="blt.css" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="BiLi_live_Tool.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <script>
      // Apply the saved theme before first paint; Blazor reconciles with config.skin later.
      (function () {
        var t = 'console';
        try { t = localStorage.getItem('blt_theme') || 'console'; } catch (e) {}
        document.documentElement.dataset.theme = t;
        window.bltSetTheme = function (name) {
          document.documentElement.dataset.theme = name;
          try { localStorage.setItem('blt_theme', name); } catch (e) {}
        };
      })();

      // Verification hook used by the loopback debug bridge
      // (POST /api/maui/debug/eval). Returns a string for primitives, JSON
      // for objects, and an "ERR: ..." marker instead of throwing.
      window.bltEval = function (code) {
        try {
          var r = (0, eval)(code);
          if (typeof r === 'string') return r;
          if (r === undefined) return 'undefined';
          return JSON.stringify(r);
        } catch (e) {
          return 'ERR: ' + (e && e.message ? e.message : String(e));
        }
      };
    </script>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="blt-audio.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
