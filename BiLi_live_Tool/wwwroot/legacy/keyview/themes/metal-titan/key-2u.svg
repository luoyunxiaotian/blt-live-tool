<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80">
  <defs>
    <linearGradient id="t-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#55585b"/>
      <stop offset="35%" stop-color="#313336"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>
    <linearGradient id="t-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2c2e"/>
      <stop offset="25%" stop-color="#3b3e42"/>
      <stop offset="50%" stop-color="#242628"/>
      <stop offset="75%" stop-color="#383b3e"/>
      <stop offset="100%" stop-color="#1a1c1d"/>
    </linearGradient>
    <linearGradient id="t-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80868c"/>
      <stop offset="100%" stop-color="#202224"/>
    </linearGradient>
  </defs>
  <!-- Outer Bevel -->
  <rect x="2" y="2" width="156" height="76" rx="6" fill="url(#t-bevel)" stroke="#111213" stroke-width="2"/>
  <!-- Rim Highlight -->
  <rect x="5" y="4" width="150" height="70" rx="4" fill="none" stroke="url(#t-edge)" stroke-width="1.2" opacity="0.7"/>
  <!-- Main Face -->
  <rect x="7" y="6" width="146" height="66" rx="4" fill="url(#t-plate)"/>
  <!-- Industrial Hairline accents -->
  <line x1="12" y1="12" x2="148" y2="12" stroke="#60666d" stroke-width="0.8" opacity="0.5"/>
  <line x1="12" y1="70" x2="148" y2="70" stroke="#181a1b" stroke-width="1" opacity="0.8"/>
  <circle cx="16" cy="18" r="2" fill="#202224" stroke="#45484c" stroke-width="0.8"/>
  <circle cx="144" cy="18" r="2" fill="#202224" stroke="#45484c" stroke-width="0.8"/>
</svg>